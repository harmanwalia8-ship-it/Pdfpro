name: Build APK

# Every push builds a signed APK. When the signing secrets are set, the APK is
# published as a GitHub Release ("build-<number>"), which the app's Update
# button installs.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Unpack signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/margin.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/margin.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not set, so this build uses a throwaway debug key and no release is published. See README."
          fi

      - name: Test
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v6
        with:
          name: margin-build-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: env.SIGNING_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "margin-build-${{ github.run_number }}.apk"
          gh release create "build-${{ github.run_number }}" "margin-build-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Margin build ${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} (${{ github.sha }}). On your tablet: download the APK below and tap it to install, or use Update in the app."
