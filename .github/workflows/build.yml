name: Build APK

# Every push builds a signed APK. When the signing secrets are set, the APK is
# published as a GitHub Release ("build-<number>"), which the app's Update
# button installs.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Unpack signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/margin.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/margin.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets are not set, so this build uses a throwaway debug key and no release is published. See README."
          fi

      - name: Test
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v6
        with:
          name: margin-build-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk

  # Runs the app on an Android 14 tablet emulator and saves screenshots of each step.
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run on a tablet emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/emulator-test.sh

      - name: Keep screenshots and log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-screenshots-${{ github.run_number }}
          path: emulator-output/

  # Publishes the APK only when the build is signed AND the app passed the emulator test.
  release:
    needs: [build, emulator-test]
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: margin-build-${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk "margin-build-${{ github.run_number }}.apk"
          gh release create "build-${{ github.run_number }}" "margin-build-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Margin build ${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} (${{ github.sha }}) and checked on an Android 14 tablet emulator. On your tablet: download the APK below and tap it to install, or use Download in the app."
